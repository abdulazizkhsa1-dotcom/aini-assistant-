<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد البصري الذكي للمكفوفين - النسخة الفاخرة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { background-color: #0d0d0d; color: #00ff66; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .card { background: #1a1a1a; border: 2px solid #00ff66; border-radius: 20px; padding: 20px; max-width: 450px; margin: auto; box-shadow: 0 0 20px rgba(0,255,102,0.2); }
        h1 { font-size: 22px; color: #ffffff; margin-bottom: 5px; }
        .tag { background: #00ff66; color: #000; font-weight: bold; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        video { width: 100%; border-radius: 15px; border: 2px solid #333; margin-top: 15px; transform: scaleX(-1); }
        .alert-box { background: #262626; color: #fff; padding: 15px; border-radius: 12px; margin-top: 15px; font-size: 18px; font-weight: bold; border-right: 5px solid #00ff66; }
        button { background: linear-gradient(135deg, #00ff66, #00b347); color: #000; border: none; padding: 16px 25px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <span class="tag">AI PRO V2.0</span>
    <h1>👁️ عيني الرقمية - المساعد الذكي</h1>
    
    <button id="start-btn" onclick="initSystem()">🚀 تشغيل النظام المتقدم</button>

    <video id="webcam" autoplay playsinline muted></video>
    <div class="alert-box" id="status">جاهز للبدء...</div>
</div>

<script>
    let model;
    let lastSpoken = "";
    let lastTime = 0;
    let frameCounter = 0;

    // قاموس الأجسام المتقدم والمترجم للمخاطر
    const smartObjects = {
        'oven': 'خطر، فرن أو غاز حراري',
        'microwave': 'جهاز ميكروويف حراري',
        'sink': 'مغسلة مياه',
        'refrigerator': 'ثلاجة، حاجز كبير',
        'chair': 'كرسي أمامك',
        'table': 'طاولة أمامك',
        'dining table': 'طاولة طعام',
        'person': 'شخص أمامك',
        'cell phone': 'جوال',
        'laptop': 'كمبيوتر محمول',
        'clock': 'ساعة حائط',
        'door': 'باب أو ممر',
        'tv': 'شاشة أو جهاز كهربائي'
    };

    function speakFast(text) {
        const now = Date.now();
        // تقليل زمن الانتظار إلى ثانية واحدة فقط لاستجابة فورية فائقة
        if (text === lastSpoken && (now - lastTime) < 1200) return;

        window.speechSynthesis.cancel(); // إيقاف الصوت القديم فوراً لنطق التنبيه الجديد
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ar-SA';
        msg.rate = 1.3; // تسريع نطق الصوت بنسبة 30% لتنبيه أسرع
        window.speechSynthesis.speak(msg);

        lastSpoken = text;
        lastTime = now;
    }

    async function initSystem() {
        const status = document.getElementById('status');
        speakFast("جاري تشغيل محرك الذكاء الاصطناعي الفائق");
        status.innerText = "⏳ جاري تحميل المحرك السريع...";

        try {
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' }); // تحميل النسخة الأسرع خفة
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
            });

            const video = document.getElementById('webcam');
            video.srcObject = stream;

            video.onloadeddata = () => {
                document.getElementById('start-btn').style.display = 'none';
                status.innerText = "🟢 الرادار يعمل الآن بأقصى سرعة";
                speakFast("النظام يعمل ويراقب المحيط الآن");
                processVideo(video);
            };
        } catch (e) {
            status.innerText = "❌ تعذر تفعيل الكاميرا";
            speakFast("خطأ في تشغيل الكاميرا");
        }
    }

    async function processVideo(video) {
        frameCounter++;
        
        // معالجة إطار كل إطارين لزيادة سلاسة وسرعة التطبيق
        if (frameCounter % 2 === 0) {
            const predictions = await model.detect(video, 6, 0.45); // زيادة الحساسية وتقليل وقت المعالجة

            if (predictions.length > 0) {
                let foundRisk = false;

                predictions.forEach(item => {
                    const objName = item.class;

                    // حساب المساحة التقريبية للجسم لمعرفة القرب الشديد (مثل الجدار أو الحاجز)
                    const area = item.bbox[2] * item.bbox[3];
                    
                    if (smartObjects[objName]) {
                        let alertText = smartObjects[objName];
                        
                        // إذا كان الجسم يغطي أكثر من 50% من الشاشة يعتبر حاجزاً قريباً جداً
                        if (area > 80000) {
                            alertText = `انتبه، جدار أو ${alertText} قريب جداً`;
                        }

                        document.getElementById('status').innerText = alertText;
                        speakFast(alertText);
                        foundRisk = true;
                    }
                });
            }
        }

        requestAnimationFrame(() => processVideo(video));
    }
</script>

</body>
</html>
